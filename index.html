<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comrade Sentinel v2 // Batch Threat & Scam Inspector</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #111827;
      --border: #1f2937;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --accent: #38bdf8;
      --danger: #ef4444;
      --warning: #f59e0b;
      --success: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'JetBrains Mono', -apple-system, BlinkMacSystemFont, monospace;
      padding: 24px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      max-width: 950px;
      width: 100%;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid var(--accent);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      font-weight: bold;
      font-size: 1.2rem;
    }

    h1 {
      font-size: 1.25rem;
      letter-spacing: -0.5px;
    }

    .badge {
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 9999px;
      background: rgba(16, 185, 129, 0.1);
      color: var(--success);
      border: 1px solid var(--success);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--success);
      box-shadow: 0 0 8px var(--success);
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .api-row {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
    }

    textarea, input[type="text"] {
      width: 100%;
      background: #0b0f19;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }

    textarea:focus, input[type="text"]:focus {
      border-color: var(--accent);
    }

    textarea {
      height: 120px;
      resize: vertical;
    }

    button {
      background: var(--accent);
      color: #000;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      padding: 12px 24px;
      cursor: pointer;
      font-family: inherit;
      transition: opacity 0.2s;
      margin-top: 12px;
      width: 100%;
    }

    button:hover { opacity: 0.9; }

    .results-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
      font-size: 0.85rem;
    }

    .results-table th, .results-table td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }

    .results-table th {
      color: var(--muted);
      text-transform: uppercase;
      font-size: 0.75rem;
    }

    .results-table tr:hover {
      background: rgba(56, 189, 248, 0.05);
      cursor: pointer;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-top: 20px;
    }

    .metric-card {
      background: #0b0f19;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }

    .metric-title {
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .metric-value {
      font-size: 1.25rem;
      font-weight: 700;
    }

    .log-terminal {
      background: #05070c;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      font-size: 0.85rem;
      color: #34d399;
      height: 180px;
      overflow-y: auto;
      margin-top: 16px;
      line-height: 1.6;
    }

    .log-entry { margin-bottom: 4px; }
    .log-time { color: var(--muted); margin-right: 8px; }
    .log-warn { color: var(--warning); }
    .log-danger { color: var(--danger); }

    .tag {
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 600;
      display: inline-block;
    }

    .tag-danger { background: rgba(239, 68, 68, 0.15); color: var(--danger); }
    .tag-warning { background: rgba(245, 158, 11, 0.15); color: var(--warning); }
    .tag-success { background: rgba(16, 185, 129, 0.15); color: var(--success); }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="brand">
        <div class="brand-icon">🛡️</div>
        <div>
          <h1>SENTINEL v2 // Batch Threat Inspector</h1>
          <p style="font-size: 0.75rem; color: var(--muted);">Automated URL Extraction & Live API Phishing Detection</p>
        </div>
      </div>
      <div class="badge"><span class="dot"></span> READY</div>
    </header>

    <div class="card">
      <div class="api-row">
        <input type="text" id="apiKey" placeholder="Google Safe Browsing API Key (Optional - leave empty for heuristic scan)">
      </div>
      <label style="font-size: 0.85rem; color: var(--muted); font-weight: 600;">PASTE TEXT, EMAILS, OR URL LIST BELOW</label>
      <textarea id="rawText" placeholder="Paste raw text here... Example: Check this out https://aldi.frosttill.shop/ and also http://192.168.1.1/login or paypal-security-update.xyz"></textarea>
      <button onclick="processBatch()">EXTRACT & SCAN ALL URLS</button>
    </div>

    <div id="resultsContainer" style="display: none;">
      <div class="card">
        <div class="metric-title">Extracted Domains & Risk Summary</div>
        <table class="results-table">
          <thead>
            <tr>
              <th>Extracted Domain / URL</th>
              <th>Risk Score</th>
              <th>Classification</th>
              <th>Safe Browsing API</th>
            </tr>
          </thead>
          <tbody id="batchTableBody"></tbody>
        </table>
      </div>

      <div class="metrics-grid">
        <div class="metric-card">
          <div class="metric-title">Selected Domain</div>
          <div class="metric-value" id="selectedDomain" style="font-size: 1rem; color: var(--accent);">--</div>
        </div>
        <div class="metric-card">
          <div class="metric-title">Risk Score</div>
          <div class="metric-value" id="riskScoreVal">0/100</div>
        </div>
        <div class="metric-card">
          <div class="metric-title">Primary Flag</div>
          <div class="metric-value" id="primaryFlagVal" style="font-size: 0.9rem;">--</div>
        </div>
      </div>

      <div class="card" style="margin-top: 20px;">
        <div class="metric-title">Inspection Log & Audit Trail</div>
        <div class="log-terminal" id="terminalLog"></div>
      </div>
    </div>
  </div>

  <script>
    let scanResults = [];

    function logMessage(msg, type = 'info') {
      const log = document.getElementById('terminalLog');
      const time = new Date().toLocaleTimeString();
      let colorClass = '';
      if (type === 'warn') colorClass = 'log-warn';
      if (type === 'danger') colorClass = 'log-danger';

      log.innerHTML += `<div class="log-entry ${colorClass}"><span class="log-time">[${time}]</span> ${msg}</div>`;
      log.scrollTop = log.scrollHeight;
    }

    function extractUrls(text) {
      const urlRegex = /(?:https?:\/\/|www\.)[^\s<>"'{}()]+|[a-zA-Z0-9-]+\.(?:com|org|net|io|gov|edu|shop|xyz|top|site|online|click|info|app|dev|co|uk)(?:\/[^\s<>"'{}()]*)?/gi;
      const rawMatches = text.match(urlRegex) || [];
      const jsKeywords = [
        'console.log', 'rawtext.match', 'urls.length', 'urls.foreach',
        'flags.push', 'flags.join', 'host.endswith', 'flags.length'
      ];
      const cleaned = rawMatches
        .map(url => url.replace(/[;,)"'.]+$/g, ''))
        .filter(url => !jsKeywords.some(keyword => url.toLowerCase().includes(keyword)));

      return [...new Set(cleaned)]; // Deduplicate
    }

    function evaluateDomainRisk(host) {
      host = host.toLowerCase();
      let score = 0;
      let flags = [];

      if (/\.(shop|xyz|top|online|click|cfd|gq|tk|ml|ga|work|rest|icu|site)$/i.test(host)) {
        score += 40;
        flags.push('Disposable/Abused TLD');
      }

      const brandRegex = /(aldi|amazon|paypal|apple|ikea|chase|binance|wells|netflix|microsoft|bankofamerica|target)/i;
      if (brandRegex.test(host) && !host.endsWith('.com') && !host.endsWith('.org')) {
        score += 45;
        flags.push('Brand Spoofing');
      }

      const keywordRegex = /(login|verify|security|alert|update|wallet|claim|clearance)/i;
      if (keywordRegex.test(host) && !host.endsWith('.com')) {
        score += 20;
        flags.push('Phishing Keyword');
      }

      if (/^(\d{1,3}\.){3}\d{1,3}$/.test(host)) {
        score += 60;
        flags.push('Raw IP Host');
      }

      score = Math.min(score, 100);

      let classification = 'CLEAN';
      if (score >= 50) classification = 'HIGH RISK';
      else if (score > 0) classification = 'SUSPICIOUS';

      return { score, classification, flags };
    }

    async function checkGoogleSafeBrowsing(urls, apiKey) {
      if (!apiKey) return null;
      const endpoint = `https://safebrowsing.googleapis.com/v4/threatMatches:find?key=${apiKey}`;
      const payload = {
        client: { clientId: "sentinel-app", clientVersion: "2.0" },
        threatInfo: {
          threatTypes: ["MALWARE", "SOCIAL_ENGINEERING", "UNWANTED_SOFTWARE"],
          platformTypes: ["ANY_PLATFORM"],
          threatEntryTypes: ["URL"],
          threatEntries: urls.map(u => ({ url: u.startsWith('http') ? u : 'https://' + u }))
        }
      };

      try {
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await response.json();
        return data.matches || [];
      } catch (err) {
        logMessage(`[API ERROR] Safe Browsing lookup failed: ${err.message}`, 'warn');
        return null;
      }
    }

    async function processBatch() {
      const rawText = document.getElementById('rawText').value.trim();
      const apiKey = document.getElementById('apiKey').value.trim();
      if (!rawText) return alert('Please paste some text containing URLs first.');

      const urls = extractUrls(rawText);
      if (urls.length === 0) return alert('No valid URLs or domain patterns found in the pasted text.');

      document.getElementById('resultsContainer').style.display = 'block';
      const tableBody = document.getElementById('batchTableBody');
      const terminalLog = document.getElementById('terminalLog');
      tableBody.innerHTML = '';
      terminalLog.innerHTML = '';

      logMessage(`[START] Extracted ${urls.length} unique target(s) from input text.`);

      // Optional Google Safe Browsing Check
      let apiMatches = null;
      if (apiKey) {
        logMessage(`[API] Querying Google Safe Browsing database...`);
        apiMatches = await checkGoogleSafeBrowsing(urls, apiKey);
      }

      scanResults = [];

      urls.forEach((rawUrl, index) => {
        let formattedUrl = rawUrl.startsWith('http://') || rawUrl.startsWith('https://') ? rawUrl : 'https://' + rawUrl;
        let host = '';
        try {
          host = new URL(formattedUrl).hostname.toLowerCase();
        } catch(e) {
          host = rawUrl.toLowerCase();
        }

        const domainRisk = evaluateDomainRisk(host);
        let riskScore = domainRisk.score;
        let classification = domainRisk.classification;
        const flags = domainRisk.flags;

        // Safe Browsing API Match Check
        let apiStatus = 'Not Queried';
        if (apiMatches) {
          const match = apiMatches.find(m => m.threat.url.includes(host));
          if (match) {
            riskScore = 100;
            classification = 'HIGH RISK';
            apiStatus = `FLAGGED (${match.threatType})`;
            flags.push(`Google API Threat: ${match.threatType}`);
          } else {
            apiStatus = 'CLEAN';
          }
        }

        const resultObj = {
          rawUrl,
          host,
          riskScore,
          classification,
          flags: flags.length > 0 ? flags : ['None'],
          apiStatus
        };

        scanResults.push(resultObj);

        // Add row to table
        const tr = document.createElement('tr');
        tr.onclick = () => selectResult(index);

        let tagClass = 'tag-success';
        if (resultObj.classification === 'HIGH RISK') tagClass = 'tag-danger';
        else if (resultObj.classification === 'SUSPICIOUS') tagClass = 'tag-warning';

        tr.innerHTML = `
          <td><code>${host}</code></td>
          <td><strong>${resultObj.riskScore}/100</strong></td>
          <td><span class="tag ${tagClass}">${resultObj.classification}</span></td>
          <td><span class="tag ${apiStatus.includes('FLAGGED') ? 'tag-danger' : 'tag-success'}">${apiStatus}</span></td>
        `;
        tableBody.appendChild(tr);
      });

      // Select first result by default
      selectResult(0);
    }

    function selectResult(index) {
      const res = scanResults[index];
      if (!res) return;

      document.getElementById('selectedDomain').innerText = res.host;
      document.getElementById('riskScoreVal').innerText = `${res.riskScore}/100`;
      document.getElementById('primaryFlagVal').innerText = res.flags[0];

      logMessage(`--- DETAILED REPORT: ${res.host} ---`);
      logMessage(`Target URL: ${res.rawUrl}`);
      logMessage(`Calculated Risk Score: ${res.riskScore}/100`);
      logMessage(`Identified Flags: ${res.flags.join(', ')}`);
      logMessage(`API Threat Status: ${res.apiStatus}`);
    }
  </script>
</body>
</html>
